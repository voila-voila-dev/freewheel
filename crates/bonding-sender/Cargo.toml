[package]
name = "bonding-sender"
description = "Bonding sender: spreads one SRT stream over every modem of the box"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bonding-sender"
path = "src/main.rs"

[[bin]]
name = "freewheel-sender"
path = "src/bin/freewheel_sender.rs"

[dependencies]
bitrate-control = { path = "../bitrate-control" }
bonding-protocol = { path = "../bonding-protocol" }
freewheel-noise = { path = "../freewheel-noise" }
net-sys = { path = "../net-sys" }

[dev-dependencies]
bitrate-control = { path = "../bitrate-control" }
alloc-counter = { path = "../alloc-counter" }
bonding-receiver = { path = "../bonding-receiver" }

[lints]
workspace = true
