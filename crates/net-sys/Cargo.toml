[package]
name = "net-sys"
description = "The few C library calls std does not expose (poll, setsockopt, signal), behind safe wrappers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Calling the C library needs `unsafe`: like `alloc-counter`, this crate is an exception to the
# workspace's `unsafe_code = "forbid"`. Every block carries a `SAFETY:` comment.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
