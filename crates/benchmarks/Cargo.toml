[package]
name = "benchmarks"
description = "Hot-path benchmarks: one binary, one benchmark per file, measured by scripts/bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "hot-paths"
path = "src/main.rs"

[dependencies]
bonding-protocol = { path = "../bonding-protocol" }
bonding-receiver = { path = "../bonding-receiver" }
bonding-sender = { path = "../bonding-sender" }
bitrate-control = { path = "../bitrate-control" }

[dev-dependencies]
alloc-counter = { path = "../alloc-counter" }

[lints]
workspace = true
