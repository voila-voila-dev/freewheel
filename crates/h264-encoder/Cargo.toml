[package]
name = "h264-encoder"
description = "H.264 encoder for the lab whose bitrate can change while it runs (libx264 through a C shim)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lab-encoder"
path = "src/bin/lab_encoder.rs"

[dependencies]
bitrate-control = { path = "../bitrate-control" }

# Calling libx264 needs `unsafe`: like `net-sys`, this crate is an exception to the workspace's
# `unsafe_code = "forbid"`. Every block carries a `SAFETY:` comment. Lab only: never on the box.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
