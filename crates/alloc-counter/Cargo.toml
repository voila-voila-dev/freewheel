[package]
name = "alloc-counter"
description = "Counts heap allocations per thread, to prove hot paths allocate nothing (tests and benchmarks only)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A global allocator needs `unsafe`: this crate is the only exception to the workspace's
# `unsafe_code = "forbid"`, and it is never linked into what runs on the box.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
