[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/voila-voila-dev/freewheel"
rust-version = "1.94"

# No third-party crates unless a decision in docs/technical/decisions.md says otherwise.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Like release, but keeps symbols so scripts/bench can attribute size to each crate.
[profile.size-report]
inherits = "release"
strip = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
